<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Dashboard · salmo</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		body { font-family: system-ui, sans-serif; padding: 1rem 2rem; max-width: 1100px; margin: 0 auto; }
		header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; padding-bottom: 0.75rem; border-bottom: 1px solid #eee; }
		header h1 { margin: 0; font-size: 1.4rem; }
		.controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
		.controls button { font: inherit; padding: 0.3rem 0.7rem; }
		.controls label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.95rem; }
		.controls input[type=range] { width: 120px; }
		.stats { display: flex; gap: 1.5rem; font-family: ui-monospace, monospace; font-size: 0.9rem; color: #444; }
		.stats span strong { color: #06f; }

		.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 1rem; }
		x-metric-lazy { display: block; }
		.metric {
			background: #f4f4f4;
			border: 1px solid #e0e0e0;
			border-radius: 4px;
			padding: 0.5rem;
			text-align: center;
			font-family: ui-monospace, monospace;
			font-size: 0.95rem;
			min-height: 2.5rem;
			display: flex; align-items: center; justify-content: center;
			transition: background 0.4s ease-out, color 0.4s ease-out;
		}
		.metric.flash { background: #06f; color: white; transition: none; }

		x-dashboard { display: block; }
	</style>
</head>
<body>
	<x-dashboard></x-dashboard>
	<framework-devtools></framework-devtools>
	<script type="module" src="./host/app.js"></script>
</body>
</html>
