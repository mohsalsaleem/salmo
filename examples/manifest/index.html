<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Manifest Explorer · mohsal-framework</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		body { font-family: system-ui, sans-serif; padding: 2rem; max-width: 900px; margin: 0 auto; }
		h1 { margin-top: 0; }
		form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
		input[type=url] { flex: 1; font: inherit; padding: 0.4rem 0.6rem; border: 1px solid #ccc; border-radius: 4px; }
		button { font: inherit; padding: 0.4rem 0.9rem; }
		.suggestions { color: #888; font-size: 0.85rem; margin-bottom: 1rem; }
		.suggestions a { color: #06f; cursor: pointer; }

		.manifest-meta { background: #f7f7f7; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
		.manifest-meta strong { color: #06f; }

		.component-card { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; margin-bottom: 1rem; }
		.component-card h3 { margin: 0 0 0.5rem; font-family: ui-monospace, monospace; font-size: 1.05rem; }
		.component-card .src { color: #888; font-family: ui-monospace, monospace; font-size: 0.85rem; }
		.preview { margin-top: 0.75rem; padding: 0.75rem; background: #fafafa; border: 1px dashed #ccc; border-radius: 4px; min-height: 3rem; }
		.preview .placeholder { color: #888; font-style: italic; }

		pre { background: #f5f5f5; padding: 0.5rem; border-radius: 4px; font-size: 0.85rem; overflow-x: auto; }
		.error { background: #fff5f5; border: 1px solid #c00; color: #c00; padding: 0.75rem; border-radius: 4px; }
	</style>
</head>
<body>
	<x-manifest-explorer></x-manifest-explorer>
	<script type="module" src="./app.js"></script>
</body>
</html>
